name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint
      - name: Require changeset on package PRs
        if: >
          github.event_name == 'pull_request' &&
          github.head_ref != 'changeset-release/main' &&
          github.actor != 'dependabot[bot]'
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^packages/'; then
            pnpm changeset status --since=origin/${{ github.base_ref }}
          else
            echo "No packages/** changes; changeset not required."
          fi

  react-peer-smoke:
    runs-on: ubuntu-latest
    name: react peers smoke (@kristijorgji/react-localized-routing)
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kristijorgji/react-localized-routing build
      - run: pnpm --filter @kristijorgji/react-localized-routing test
